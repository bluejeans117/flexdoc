name: Temporary 2.9 Minimal Scripting IntelliSense

on:
  push:
    branches:
      - tmp/prepare-2.9-script-intellisense-minimal

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: tmp/prepare-2.9-script-intellisense-minimal
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Minimize CodeMirror dependency metadata
        run: |
          npm uninstall --package-lock-only --ignore-scripts --no-audit --no-fund -w packages/client codemirror @codemirror/lang-javascript
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund -w packages/client --save-exact @codemirror/autocomplete@6.20.3 @codemirror/view@6.43.11

      - name: Install full repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Wire minimal smart script editor
        run: python .github/scripts/tmp-wire-2.9-script-intellisense.py

      - name: Validate diff
        run: |
          git diff --check
          git status --short

      - name: Build core
        run: npm run build:core

      - name: Lint client
        run: npm run lint -w packages/client

      - name: Test client
        run: npm run test -w packages/client -- --runInBand

      - name: Build client library and standalone
        run: npm run build -w packages/client

      - name: Commit validated product source
        run: |
          git config user.name 'Vishnu R'
          git config user.email '45818225+bluejeans117@users.noreply.github.com'
          git add package-lock.json packages/client/package.json packages/client/src/components/ApiClient.tsx packages/client/src/components/ApiClientScriptEditor.tsx packages/client/src/index.ts packages/client/src/utils/api-client-script-intellisense.ts packages/client/src/utils/api-client-script-intellisense.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Validated product tree already committed.'
          else
            git commit -m 'feat: api-client/2.9: add lightweight scripting intellisense' -m 'Replace plain script textareas with a lightweight CodeMirror editor and phase-aware FlexDoc IntelliSense. Keep dot-triggered and Ctrl+Space completion, signatures, documentation, assertion chains, and known variable keys without bundling the full JavaScript language parser or basic editor preset.'
            git push origin HEAD:tmp/prepare-2.9-script-intellisense-minimal
          fi
