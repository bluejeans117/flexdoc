name: Temporary Validate 2.9 Collection Runner Core

on:
  push:
    branches:
      - tmp/prepare-2.9-collection-runner-core

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: tmp/prepare-2.9-collection-runner-core
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate corrected runner core
        run: |
          if [ -f packages/client/src/utils/api-client-runner.ts ]; then
            echo 'Runner source already committed; validating existing source.'
          else
            python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/tmp-prepare-2.9-collection-runner-core.yml').read_text()
          marker = '      - name: Generate collection runner core\n        run: |\n'
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n      - name: Validate focused diff', start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/generate-runner.sh').write_text(script)
          PY
            bash /tmp/generate-runner.sh
            python - <<'PY'
          from pathlib import Path
          path = Path('packages/client/src/components/ApiClientWorkspace.tsx')
          text = path.read_text()
          text = text.replace('  createApiClientId,\n', '')
          path.write_text(text)
          PY
          fi

      - name: Validate focused source diff
        run: |
          if [ ! -f packages/client/src/utils/api-client-runner.ts ]; then
            echo 'Runner source was not generated.'
            exit 1
          fi
          git add -N packages/client/src/utils/api-client-runner.ts packages/client/src/utils/api-client-runner.test.ts || true
          git diff --check
          changed=$(git diff --name-only)
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed"
            unexpected=$(printf '%s\n' "$changed" | grep -Ev '^(packages/client/src/components/ApiClientWorkspace\.tsx|packages/client/src/index\.ts|packages/client/src/utils/api-client-workspace\.ts|packages/client/src/utils/api-client-runner\.ts|packages/client/src/utils/api-client-runner\.test\.ts)$' || true)
            if [ -n "$unexpected" ]; then
              echo "Unexpected changed files:"
              echo "$unexpected"
              exit 1
            fi
            test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 5
          fi

      - name: Build core
        run: npm run build:core

      - name: Lint client
        run: npm run lint -w packages/client

      - name: Test client
        run: npm run test -w packages/client -- --runInBand

      - name: Build client
        run: npm run build -w packages/client

      - name: Commit validated source
        run: |
          git add packages/client/src/components/ApiClientWorkspace.tsx \
                  packages/client/src/index.ts \
                  packages/client/src/utils/api-client-workspace.ts \
                  packages/client/src/utils/api-client-runner.ts \
                  packages/client/src/utils/api-client-runner.test.ts
          if git diff --cached --quiet; then
            echo 'Validated source already committed.'
            exit 0
          fi
          git config user.name 'Vishnu R'
          git config user.email '45818225+bluejeans117@users.noreply.github.com'
          git commit -m 'feat: api-client/2.9: add collection runner core' \
            -m 'Add a sequential collection and folder runner built on the shared request executor. Carry collection and environment script mutations between saved requests, preserve inherited auth and history recording, centralize workspace mutation helpers, and expose runner APIs with focused coverage.'
          git push origin HEAD:tmp/prepare-2.9-collection-runner-core
