name: Consolidate Examples Sync

on:
  pull_request:
    paths:
      - '.github/workflows/consolidate-examples-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Rewrite legacy example paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('docs/api-reference.md'),
              Path('docs/configuration.md'),
              Path('docs/getting-started.md'),
              Path('docs/theming.md'),
          ]
          for path in paths:
              text = path.read_text()
              text = text.replace('../packages/examples', '../examples')
              path.write_text(text)
          PY

      - name: Regenerate root npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Remove one-shot workflow
        run: rm .github/workflows/consolidate-examples-sync.yml

      - name: Commit generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate example workspace metadata"
          git push origin HEAD:${{ github.head_ref }}
