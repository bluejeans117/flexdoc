name: Browser E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Build canonical standalone renderer
        run: npm run build:client

      - name: Synchronize adapter renderer assets
        run: npm run sync:adapter-assets

      - name: Apply AGPL-3.0-or-later notice
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('LICENSE')
          text = path.read_text()
          notice = '''SPDX-License-Identifier: AGPL-3.0-or-later

          FlexDoc is free software: you can redistribute it and/or modify it under the terms of
          the GNU Affero General Public License as published by the Free Software Foundation,
          either version 3 of the License, or (at your option) any later version.

          '''
          if not text.startswith('SPDX-License-Identifier: AGPL-3.0-or-later'):
              path.write_text(notice + text)
          PY

      - name: Commit generated repository updates
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- LICENSE adapters/go/assets adapters/python/src/prauga_flexdoc/_assets adapters/rust/assets; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE adapters/go/assets adapters/python/src/prauga_flexdoc/_assets adapters/rust/assets
          git commit -m "Sync generated assets and license notice"
          git push origin HEAD:${{ github.head_ref }}

      - name: Install CLI dependencies using local Prauga client
        run: npm install --prefix tools/flexdoc-cli --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "${{ github.workspace }}/packages/client" js-yaml@^4.1.0

      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run renderer browser E2E and visual regression checks
        run: npx playwright test

      - name: Run CLI static-site browser E2E
        env:
          FLEXDOC_CLIENT_DIR: ${{ github.workspace }}/packages/client
        run: npx playwright test --config playwright.cli.config.cjs

      - name: Verify adapter renderer parity
        run: npm run check:adapter-assets

      - name: Upload Playwright test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload renderer Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload CLI Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-cli-report
          path: playwright-cli-report/
          if-no-files-found: ignore
