name: Browser E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Build canonical standalone renderer
        run: npm run build:client

      - name: Synchronize generated renderer assets
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          npm run sync:adapter-assets
          node scripts/verify-go-example-sum.mjs --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adapters/go/assets adapters/python/src/prauga_flexdoc/_assets adapters/rust/assets examples/go-net-http/go.sum
          if ! git diff --cached --quiet; then
            git commit -m "chore: renderer: sync assets for API Client history"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload canonical renderer
        uses: actions/upload-artifact@v7
        with:
          name: canonical-renderer
          path: |
            packages/client/dist/standalone/flexdoc.standalone.js
            packages/client/dist/standalone/flexdoc.standalone.css
          if-no-files-found: error

      - name: Install CLI dependencies using local Prauga client
        run: npm install --prefix tools/flexdoc-cli --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "${{ github.workspace }}/packages/client" js-yaml@^4.1.0

      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run renderer browser E2E and visual regression checks
        run: npx playwright test

      - name: Run CLI static-site browser E2E
        env:
          FLEXDOC_CLIENT_DIR: ${{ github.workspace }}/packages/client
        run: npx playwright test --config playwright.cli.config.cjs

      - name: Verify adapter renderer parity
        run: npm run check:adapter-assets

      - name: Upload Playwright test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload renderer Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload CLI Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-cli-report
          path: playwright-cli-report/
          if-no-files-found: ignore
